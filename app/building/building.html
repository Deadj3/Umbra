<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Building Editor</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="building.css">
<link rel="stylesheet" href="../shape.css">
<link rel="stylesheet" href="../tactical.css">
</head>
<body class="bld">
<a class="skip" href="#cv">Skip to the building</a>

<header id="top">
  <nav id="menubar" role="menubar" aria-label="3D building editor menu"></nav>
  <div class="grow"></div>
  <label class="namefield">Building <input id="bName" value="Untitled building" size="16" spellcheck="false" autocomplete="off" maxlength="80"></label>
  <span class="vsep" aria-hidden="true"></span>
  <button class="ib" id="tbUndo" type="button" aria-label="Undo" data-tip="Undo (Ctrl+Z)" data-tipdir="down"></button>
  <button class="ib" id="tbRedo" type="button" aria-label="Redo" data-tip="Redo (Ctrl+Y)" data-tipdir="down"></button>
  <span class="vsep" aria-hidden="true"></span>
  <div class="seg" id="viewSeg" role="group" aria-label="View"></div>
  <span class="vsep" aria-hidden="true"></span>
  <button class="ib" id="tbDown" type="button" aria-label="Floor down" data-tip="Floor down (Page Down)" data-tipdir="down"></button>
  <output id="floorName" class="floorname" aria-live="polite">Ground floor</output>
  <button class="ib" id="tbUp" type="button" aria-label="Floor up" data-tip="Floor up (Page Up)" data-tipdir="down"></button>
  <span class="vsep" aria-hidden="true"></span>
  <button class="ib" id="tbZoomOut" type="button" aria-label="Zoom out" data-tip="Zoom out (-)" data-tipdir="down"></button>
  <button class="ib" id="tbZoomIn" type="button" aria-label="Zoom in" data-tip="Zoom in (+)" data-tipdir="down"></button>
  <button class="ib" id="tbFit" type="button" aria-label="Fit the building to the window" data-tip="Fit to window (Home)" data-tipdir="down"></button>
</header>

<div id="optbar" role="toolbar" aria-label="Tool options"></div>

<aside id="rail" aria-label="Tools"></aside>

<main id="stage">
  <canvas id="cv" tabindex="0" aria-label="Building. Use the tool rail and menus, or the arrow keys and Enter, to edit."></canvas>
  <canvas id="gl" aria-hidden="true"></canvas>
  <canvas id="ov" aria-hidden="true"></canvas>
  <div id="restore" hidden></div>
</main>

<aside id="side" aria-label="Rooms, tiles, furniture and floors">
  <div id="tabs" class="mtabs" role="tablist" aria-label="Panels"></div>
  <div id="panelHost"></div>
</aside>

<footer id="status">
  <span id="stPos">Ready</span>
  <span id="stHint" class="muted"></span>
  <span id="stMsg" class="msg" role="status" aria-live="polite"></span>
</footer>

<input id="fOpen" type="file" class="sr" tabindex="-1" aria-hidden="true" accept=".pzbld,.json,.tbx,application/json">
<input id="fCat" type="file" class="sr" tabindex="-1" aria-hidden="true" accept=".txt" multiple>

<script src="../icons.js"></script>
<script src="bcommon.js"></script>
<script src="../rules_data.js"></script>
<script src="../rar.js"></script>
<script src="../zip.js"></script>
<script src="../tiles.js"></script>
<script src="../gamedata.js"></script>
<script src="model.js"></script>
<script src="vanilla.js"></script>
<script src="catalog.js"></script>
<script src="render.js"></script>
<script src="convert.js"></script>
<script src="rendergame.js"></script>
<script src="tbx.js"></script>
<script src="../dressing.js"></script>
<script src="../dressui.js"></script>
<script src="render3d.js"></script>
<script src="gen.js"></script>
<script src="ui.js"></script>
<script src="panels.js"></script>
<script src="dialogs.js"></script>
<script src="gendialog.js"></script>
<script src="boot.js"></script>
</body>
</html>
